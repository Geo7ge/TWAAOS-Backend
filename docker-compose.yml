version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: proiect_db
    environment:
      POSTGRES_USER: ${DB_USER:-proiect_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-proiect_password}
      POSTGRES_DB: ${DB_NAME:-proiect_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    networks:
      - proiect_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-proiect_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proiect_api
    environment:
      DATABASE_URL: postgresql://${DB_USER:-proiect_user}:${DB_PASSWORD:-proiect_password}@db:5432/${DB_NAME:-proiect_db}
      SUPABASE_URL: ${SUPABASE_URL:-http://db:5432}
      SUPABASE_KEY: ${SUPABASE_KEY:-local-key}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-local-service-key}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      DEBUG: ${DEBUG:-false}
      APP_NAME: ${APP_NAME:-Proiect API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - proiect_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  proiect_network:
    driver: bridge
